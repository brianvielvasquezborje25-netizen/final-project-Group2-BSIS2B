<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | BU Hangout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ================= HEADER / NAVIGATION ================= -->
  <div class="container pt-4">
    <nav class="navbar navbar-expand-md site-nav px-3 px-md-4 py-2">
      <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="index.html">
        <img src="img/logo.png" alt="" height="42" onerror="this.style.display='none'">
        <span class="brand-text">BU <span>Hangout</span></span>
      </a>
      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <i class="bi bi-list fs-2"></i>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="mainNav">
        <ul class="navbar-nav gap-md-1 py-2 py-md-0 align-items-md-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Directory</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html" aria-current="page">Login</a></li>
          <li class="nav-item ms-md-2"><a class="btn btn-ink btn-sm" href="register.html">Register</a></li>
        </ul>
      </div>
    </nav>
  </div>

  <main class="container page-wrap d-flex align-items-center justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="sticker p-4 p-md-5 position-relative">
        <i class="bi bi-mortarboard-fill doodle d1" aria-hidden="true"></i>

        <div class="text-center mb-4">
          <p class="eyebrow mb-1">Welcome back</p>
          <h1 class="page-title">Log <em>in</em></h1>
        </div>

        <div class="alert alert-danger d-none fw-bold" id="loginError" role="alert"></div>

        <form id="loginForm" action="#" method="POST" class="needs-validation" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="juan.delacruz@bicol-u.edu.ph" autocomplete="email" required>
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group has-validation">
              <input type="password" class="form-control" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
              <button type="button" class="btn btn-toggle" data-toggle-password="#password" aria-label="Show password"><i class="bi bi-eye"></i></button>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="remember" name="remember">
              <label class="form-check-label fw-bold small" for="remember">Remember me</label>
            </div>
            <a href="#" class="small fw-bold" style="color:var(--bu-orange)">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-ink w-100">Log in</button>
        </form>

        <p class="text-center small fw-bold mt-4 mb-0">
          New here? <a href="register.html" style="color:var(--bu-orange)">Create an account</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer py-3">
    <div class="container text-center">
      <small class="fw-bold" style="color:var(--muted)">&copy; 2026 Bicol University Polangui</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
