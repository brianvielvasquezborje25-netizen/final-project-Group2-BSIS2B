<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - BU Hangout</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./img/logo-favicon.png">
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        :root {
            --bu-blue: #003366;
            --bu-orange: #FF6600;
        }

        body {
            background-color: #F8F9FA;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .register-card-container {
            background-color: var(--bu-orange);
            padding: 12px;
            border-radius: 28px;
            max-width: 480px;
            width: 100%;
            margin: auto;
        }

        .register-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 2.2rem 2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .register-brand-logo {
            height: 44px;
            width: auto;
            object-fit: contain;
        }

        .btn-bu-primary {
            background-color: var(--bu-orange);
            color: white;
            border-radius: 50px;
            padding: 10px 24px;
            font-weight: 700;
            border: none;
            box-shadow: 0 4px 14px rgba(255, 102, 0, 0.3);
            transition: all 0.2s ease;
        }

        .btn-bu-primary:hover {
            background-color: #e05500;
            color: white;
            transform: translateY(-2px);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--bu-orange);
            box-shadow: 0 0 0 0.25rem rgba(255, 102, 0, 0.25);
        }
    </style>
</head>
<body>

    <!-- Header Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
        <div class="container justify-content-between">
            <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
                <img src="./img/logo.png" alt="BU Hangout Logo" class="register-brand-logo" onerror="this.style.display='none'">
                <span class="fw-bold fs-4" style="color: var(--bu-orange);">BU Hangout</span>
            </a>
            <a href="login.html" class="btn btn-outline-secondary btn-sm rounded-pill fw-bold px-3">Already have an account? Sign In</a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container d-flex align-items-center justify-content-center flex-grow-1 py-4">
        
        <div class="register-card-container shadow">
            <div class="register-card">
                
                <!-- Title & Subtitle -->
                <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1" style="color: var(--bu-blue);">Create Account</h3>
                    <p class="text-muted small mb-0">Join the BU Polangui campus food community</p>
                </div>

                <!-- Registration Form (Maps 1:1 to User.js schema) -->
                <form action="login.html" method="GET" id="registerForm">
                    
                    <!-- Full Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label small fw-bold text-secondary">Full Name</label>
                        <input type="text" class="form-control rounded-3" id="name" name="name" placeholder="Kristelle Joy De Jesus" required>
                    </div>

                    <!-- Email Address -->
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-bold text-secondary">Bicol University Email</label>
                        <input type="email" class="form-control rounded-3" id="email" name="email" placeholder="student@bicol-u.edu.ph" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label small fw-bold text-secondary">Password</label>
                        <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="At least 6 characters" required>
                    </div>

                    <!-- Role Selection (Consumer, seller, admin) -->
                    <div class="mb-4">
                        <label for="role" class="form-label small fw-bold text-secondary">Account Role</label>
                        <select class="form-select rounded-3" id="role" name="role" required>
                            <option value="" selected disabled>Select your role...</option>
                            <option value="Consumer">Consumer (Student / Visitor)</option>
                            <option value="seller">Stall Owner / Entrepreneur</option>
                            <option value="admin">System Administrator</option>
                        </select>
                        <div class="form-text small text-muted mt-1">Sellers can manage their stalls and daily menu items.</div>
                    </div>

                    <button type="submit" class="btn btn-bu-primary w-100 fw-bold py-2 mb-3">Register Account</button>
                </form>

                <div class="border-top pt-3 text-center">
                    <p class="small text-muted mb-0">Already registered? <a href="login.html" class="fw-bold text-decoration-none" style="color: var(--bu-orange);">Sign in here</a></p>
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-3 border-top mt-auto">
        <div class="container text-muted small">
            © 2026 BU Hangout • Bicol University Polangui Campus
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
